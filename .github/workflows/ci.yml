name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 excluded: @earendil-works/pi-coding-agent targets Node 22+.
        node: [22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Guard the published tarball. pi-powershell ships raw .ts source (pi
      # loads .ts extensions at runtime — no build step). The `files`
      # allowlist in package.json is authoritative.
      - name: Verify packed tarball
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          # No tests, coverage, or dev-only files should ship.
          ! grep -E '\b(test/|coverage/|scripts/|\.github/|vitest\.config)' pack.log
          # Extension entry + aliases must be present.
          grep -E 'src/extension\.ts' pack.log
          grep -E 'aliases\.json' pack.log
